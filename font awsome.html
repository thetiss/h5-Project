<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Fonts</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap"
        rel="stylesheet"
    >
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
>
    <style>
        .custom-font {
            font-family: "Poppins", sans-serif;
            font-size: 18px;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .serif-font {
            font-family: "Times New Roman", serif;
        }

        .monospace-font {
            font-family: "Courier New", monospace;
        }
.icon {
    font-size: 24px;
    color: blue;
}
    </style>
</head>
<body>
    <p class="custom-font">
        This paragraph uses Google Fonts (Poppins).
    </p>
    <p>This paragraph uses the default sans-serif font (Arial).</p>
    <p class="serif-font">This paragraph is using a serif font (Times New Roman).</p>
    <p class="monospace-font">This paragraph is using a monospace font (Courier New).</p>
<div>
	<i class="icon fas fa-heart"></i>
<i class="icon fas fa-search"></i>
<i class="icon fas fa-home"></i>
<i class="icon fas fa-user"></i>

</div>
</body>
